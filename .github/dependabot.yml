version: 2
updates:
  # Python dependencies (uv lockfile + pyproject).
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Allow up to five concurrent grouped version-update PRs, keeping routine
    # dependency maintenance active without creating an unbounded review queue.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Batch low-risk minor/patch bumps into a single PR. Major bumps stay
      # individual so they get reviewed on their own.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Allow up to five concurrent grouped action-update PRs, keeping CI
    # dependency maintenance active without creating an unbounded review queue.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # One PR for all action-version bumps (CI-only, low risk).
      github-actions:
        patterns:
          - "*"
