name: quickstart-e2e

# From-zero install on every PR: fresh runner, no .env, no volumes.
# scripts/quickstart.sh must end with SMOKE TEST PASSED (store a fact as an
# agent, restart metronix-core, recall it), and a second smoke run must pass.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quickstart-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METRONIX_MASK_SECRETS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Images, the CPU torch build and Ollama models need more than the
      # runner's default free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Clean-state preconditions
        run: |
          test ! -e .env
          test -z "$(docker volume ls -q)"

      - name: scripts/quickstart.sh
        run: |
          start=$(date +%s)
          ./scripts/quickstart.sh 2>&1 | tee quickstart.log
          echo "quickstart wall-clock: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q 'SMOKE TEST PASSED' quickstart.log
          for f in claude_desktop_config.json cursor_mcp.json vscode_mcp.json; do
            test -s "client-configs/$f"
          done

      - name: Graph-extraction model was not downloaded
        run: |
          docker exec metronix-full-ollama ollama list
          if docker exec metronix-full-ollama ollama list | awk 'NR>1 {print $1}' | grep -q '^qwen2.5:3b'; then
            echo "quickstart pulled the graph-extraction model; it must be optional" >&2
            exit 1
          fi

      - name: scripts/smoke_e2e.sh (second run)
        run: ./scripts/smoke_e2e.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a || true
          curl -sS http://localhost:8000/ready || true
          docker compose logs --tail 200 metronix-core ollama postgres || true

      - name: Upload quickstart log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickstart-log
          path: quickstart.log
          if-no-files-found: ignore
